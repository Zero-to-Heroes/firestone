<div class="general-theme web-app overlay-container-parent">
	<header class="web-header">
		<div class="header-content">
			<div class="header-left">
				<a
					routerLink="/"
					class="logo"
					aria-label="Firestone home"
					inlineSVG="assets/svg/firestone_logo_full.svg"
				></a>

				<!-- Desktop Navigation with Dropdown -->
				<div class="desktop-nav">
					<ng-container *ngIf="!isPremiumPage; else premiumDesktopNav">
					<!-- Main Section Dropdown -->
					<div class="section-dropdown" #dropdownContainer>
						<button class="dropdown-trigger" (click)="toggleDropdown()" [class.active]="isDropdownOpen">
							<span class="dropdown-icon" [inlineSVG]="currentSection.icon"></span>
							<span class="dropdown-label">{{ currentSection.label }}</span>
							<span class="dropdown-arrow" [class.rotated]="isDropdownOpen">▼</span>
						</button>

						<div class="dropdown-menu" [class.open]="isDropdownOpen">
							<button
								*ngFor="let section of navigationSections"
								class="dropdown-item"
								[class.active]="section.id === currentSection.id"
								[class.disabled]="section.disabled"
								(click)="section.disabled ? null : selectSection(section)"
								[disabled]="section.disabled"
							>
								<span class="item-icon" [inlineSVG]="section.icon"></span>
								<span class="item-label">{{ section.label }}</span>
							</button>
						</div>
					</div>

					<!-- Sub-menu Items -->
					<div class="sub-menu">
						<button
							*ngFor="let subItem of getCurrentSubItems()"
							class="sub-menu-item"
							[class.disabled]="subItem.disabled"
							[routerLink]="subItem.disabled ? null : subItem.route"
							routerLinkActive="active"
							[routerLinkActiveOptions]="{ exact: false }"
							[disabled]="subItem.disabled"
						>
							{{ subItem.label }}
						</button>
					</div>
					</ng-container>
					<ng-template #premiumDesktopNav>
						<!-- Keep the same .sub-menu wrapper as the default nav so .sub-menu-item styles (colors, alignment) apply. -->
						<div class="sub-menu">
							<a routerLink="/battlegrounds/heroes" class="sub-menu-item premium-back-to-stats">{{ statsHomeLabel }}</a>
						</div>
					</ng-template>
				</div>
			</div>

			<div class="header-right">
				<a
					routerLink="/premium"
					routerLinkActive="active"
					[routerLinkActiveOptions]="{ exact: true }"
					class="header-premium-link"
				>
					Premium
				</a>
				<web-download-button class="download-button"></web-download-button>
			</div>

			<!-- Mobile Hamburger Button -->
			<button class="hamburger-btn" (click)="toggleMobileMenu()" [class.active]="isMobileMenuOpen">
				<span class="hamburger-line"></span>
				<span class="hamburger-line"></span>
				<span class="hamburger-line"></span>
			</button>
		</div>
	</header>

	<!-- Mobile Navigation Overlay -->
	<nav class="mobile-nav" [class.open]="isMobileMenuOpen">
		<div class="mobile-nav-content">
			<button
				class="mobile-nav-item main-section premium-mobile-entry"
				routerLink="/premium"
				routerLinkActive="active"
				[routerLinkActiveOptions]="{ exact: true }"
				(click)="closeMobileMenu()"
			>
				<span class="nav-label">Premium</span>
			</button>
			<ng-container *ngFor="let section of navigationSections">
				<!-- Main Section -->
				<button
					class="mobile-nav-item main-section"
					[class.disabled]="section.disabled"
					[routerLink]="section.disabled ? null : section.route"
					routerLinkActive="active"
					(click)="section.disabled ? null : closeMobileMenu()"
					[routerLinkActiveOptions]="{ exact: true }"
					[disabled]="section.disabled"
				>
					<span class="nav-icon" [inlineSVG]="section.icon"></span>
					<span class="nav-label">{{ section.label }}</span>
				</button>

				<!-- Sub Items -->
				<button
					*ngFor="let subItem of section.subItems"
					class="mobile-nav-item sub-item"
					[class.disabled]="subItem.disabled"
					[routerLink]="subItem.disabled ? null : subItem.route"
					routerLinkActive="active"
					(click)="subItem.disabled ? null : closeMobileMenu()"
					[routerLinkActiveOptions]="{ exact: false }"
					[disabled]="subItem.disabled"
				>
					<span class="nav-label">{{ subItem.label }}</span>
				</button>
			</ng-container>
		</div>
	</nav>

	<!-- Mobile Overlay Background -->
	<div class="mobile-overlay" [class.visible]="isMobileMenuOpen" (click)="closeMobileMenu()"></div>

	<main class="web-content">
		<router-outlet></router-outlet>
	</main>
</div>
