name: Bug replay tests (test-tools/bugs)

on:
    push:
        branches:
            - master
    workflow_dispatch:

jobs:
    bug-replay-specs:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run test-tools/bugs Jest specs
              # Bug specs use libs/game-state/jest.config.ts (see testMatch there). This Jest version expects
              # --testPathPattern (singular); Nx's testPathPatterns is not wired to it, so invoke Jest directly.
              run: npx jest --config libs/game-state/jest.config.ts --runInBand --ci --silent --passWithNoTests --testPathPattern=test-tools/bugs
              env:
                  HS_REFERENCE_CARDS_JSON_PATH: https://raw.githubusercontent.com/Zero-to-Heroes/hs-reference-data/master/src/cards_short.json
                  NODE_OPTIONS: --max-old-space-size=8192
