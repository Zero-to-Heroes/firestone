name: Bug replay and rewind non-reg tests

on:
    push:
        branches:
            - master
    workflow_dispatch:

jobs:
    bug-replay-specs:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        env:
            ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run test-tools/bugs Jest specs
              # Bug specs use libs/game-state/jest.config.ts (see testMatch there). This Jest version expects
              # --testPathPattern (singular); Nx's testPathPatterns is not wired to it, so invoke Jest directly.
              # Workers are separate processes (safe for GameState/DeckCard statics). 4 fits ubuntu-latest;
              # each replay resets TestBed and reuses a per-worker cached cards DB.
              run: npx jest --config libs/game-state/jest.config.ts --maxWorkers=4 --ci --silent --passWithNoTests --testPathPattern=test-tools/bugs
              env:
                  HS_REFERENCE_CARDS_JSON_PATH: https://raw.githubusercontent.com/Zero-to-Heroes/hs-reference-data/master/src/cards_short.json
                  NODE_OPTIONS: --max-old-space-size=8192

            - name: Run test-tools/non-reg Jest specs (rewind goldens)
              run: npx jest --config libs/game-state/jest.config.ts --maxWorkers=4 --ci --silent --passWithNoTests --testPathPattern=test-tools/non-reg
              env:
                  HS_REFERENCE_CARDS_JSON_PATH: https://raw.githubusercontent.com/Zero-to-Heroes/hs-reference-data/master/src/cards_short.json
                  NODE_OPTIONS: --max-old-space-size=8192
