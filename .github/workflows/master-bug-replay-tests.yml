name: Bug replay and rewind non-reg tests

on:
    push:
        branches:
            - master
    workflow_dispatch:

jobs:
    bug-replay-specs:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        env:
            # ow-electron postinstall is skipped via npm ci --ignore-scripts below.
            ELECTRON_SKIP_BINARY_DOWNLOAD: 1
            # Downloaded once before Jest (see "Download cards reference JSON").
            HS_REFERENCE_CARDS_JSON_PATH: ${{ github.workspace }}/.ci-cache/cards_short.json
            NODE_OPTIONS: --max-old-space-size=8192
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              # Bug/non-reg Jest does not need native Overwolf modules. Skipping postinstall
              # avoids electron-builder install-app-deps + electron-rebuild (~40s+) on every run.
              run: npm ci --ignore-scripts

            - name: Download cards reference JSON
              # One local file shared by all Jest workers (avoids per-worker HTTP fetch of ~12MB).
              run: |
                  mkdir -p .ci-cache
                  curl -fsSL -o .ci-cache/cards_short.json \
                    https://raw.githubusercontent.com/Zero-to-Heroes/hs-reference-data/master/src/cards_short.json

            - name: Run test-tools/bugs Jest specs
              # Bug specs use libs/game-state/jest.config.ts (see testMatch there). This Jest version expects
              # --testPathPattern (singular); Nx's testPathPatterns is not wired to it, so invoke Jest directly.
              # Workers are separate processes (safe for GameState/DeckCard statics). 4 fits ubuntu-latest;
              # each replay resets TestBed and reuses a per-worker cached cards DB.
              run: npx jest --config libs/game-state/jest.config.ts --maxWorkers=4 --ci --silent --passWithNoTests --testPathPattern=test-tools/bugs

            - name: Run test-tools/non-reg Jest specs (rewind goldens)
              run: npx jest --config libs/game-state/jest.config.ts --maxWorkers=4 --ci --silent --passWithNoTests --testPathPattern=test-tools/non-reg
